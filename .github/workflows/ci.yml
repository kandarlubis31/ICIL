name: ICIL CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  validate:
    strategy:
      matrix:
        node-version: ["18", "20", "22", "24"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Unit tests (core, path guard, level parsing)
        run: pnpm test

      - name: Dependency audit (fail on high/critical)
        run: pnpm audit --prod --audit-level=high

      - name: Schema + duplicate keywords + cross-references
        run: node ci-validate.js

      - name: Full gate (schema + duplicates + cross-refs + eval)
        run: node ci-validate.js --with-eval

      - name: MCP server smoke test (10 tools)
        run: pnpm run mcp:smoke
